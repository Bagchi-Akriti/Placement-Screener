version: '3.8'

services:
  placementiq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: placementiq_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/app/data/placementiq.db
    volumes:
      - placementiq_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  placementiq_data:
    driver: local
